theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

url: "https://clouddiish.github.io"
title: clouddiish
description: this is my personal website with anything and everything

author:
   name: Olga Szymczak (clouddiish)
   email: olga.szymczaak@gmail.com

collections:
  tag_pages:
    output: true
    permalink: /tags/:name.html

defaults:
  - scope:
      path: ""
      type: "tag_pages"
    values:
      layout: "tag_page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "base"

minima:
  skin: dark
  nav_pages:
    - about.md
    - articles.md
    - artworks.md
    - poems.md
    - tags.md
  show_excerpts: false
  date_format: "%Y-%m-%d"
  social_links:
    - title: "my GitHub"
      icon: github
      url: "https://github.com/clouddiish"
    - title: "my LinkedIn"
      icon: linkedin
      url: "https://www.linkedin.com/in/olga-szymczak"