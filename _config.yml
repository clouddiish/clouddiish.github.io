theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate-v2

url: "https://clouddiish.github.io"
title: clouddiish
description: this is my personal website with anything and everything

author:
   name: Olga Szymczak (clouddiish)
   email: olga.szymczaak+clouddiish@gmail.com

pagination:
  enabled: true
  per_page: 10
  sort_reverse: true

sass:
  quiet_deps: true
  silence_deprecations: [import]

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "custom_post"
  - scope:
      path: ""
    values:
      layout: "base"

minima:
  skin: dark
  nav_pages:
    - about.md
  show_excerpts: true
  date_format: "%Y-%m-%d"
  social_links:
    - title: "my GitHub"
      icon: github
      url: "https://github.com/clouddiish"
    - title: "my LinkedIn"
      icon: linkedin
      url: "https://www.linkedin.com/in/olga-szymczak"