theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

url: "https://clouddiish.github.io"
title: clouddiish
description: this is my personal website with anything and everything

author:
   name: Olga Szymczak (clouddiish)
   email: olga.szymczaak@gmail.com

paginate: 2
paginate_path: "/all_posts/page:num/"

sass:
  quiet_deps: true
  silence_deprecations: [import]

collections:
  language_pages:
    output: true
  post_type_pages:
    output: true
  tag_pages:
    output: true
    permalink: /tags/:name.html

defaults:
  - scope:
      path: ""
      type: "language_pages"
    values:
      layout: "language_page"
  - scope:
      path: ""
      type: "post_type_pages"
    values:
      layout: "post_type_page"
  - scope:
      path: ""
      type: "tag_pages"
    values:
      layout: "tag_page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "custom_post"
  - scope:
      path: ""
    values:
      layout: "base"

minima:
  skin: dark
  nav_pages:
    - about.md
    - all_posts/index.html
    - post_types.md
    - languages.md
    - tags.md
  show_excerpts: false
  date_format: "%Y-%m-%d"
  social_links:
    - title: "my GitHub"
      icon: github
      url: "https://github.com/clouddiish"
    - title: "my LinkedIn"
      icon: linkedin
      url: "https://www.linkedin.com/in/olga-szymczak"